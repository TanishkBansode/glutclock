name: glutclock-daily

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "15 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-pc-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: install deps
        run: pip install -r requirements.txt

      - name: run pipeline
        run: python -m oracle_pc.pipeline run

      - name: commit fresh data + site
        run: |
          git config user.name "glutclock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs web
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "daily run $(date -u +%F-%H:%M UTC)"
            git push
          fi

  deploy-pages:
    needs: run
    if: ${{ !cancelled() && needs.run.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
